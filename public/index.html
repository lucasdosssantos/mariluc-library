<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MariLuc Library | Abra um livro. Atravesse uma realidade.</title>
  <meta name="description" content="MariLuc Library é uma biblioteca digital mágica: explore o acervo, avalie livros, escreva resenhas e participe da comunidade de leitores.">
  <meta name="theme-color" content="#1b0d29">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <a class="brand" href="/" data-link aria-label="MariLuc Library — página inicial">
      <span class="brand-book" aria-hidden="true">
        ✦
        <img class="brand-logo-img" src="/img/logo.png" alt="" onerror="this.remove()">
      </span>
      <span class="brand-name">MariLuc<span class="brand-name-accent">Library</span></span>
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Navegação principal">
      <a href="/" data-link>Início</a>
      <a href="/acervo" data-link>Acervo</a>
      <a href="/comunidade" data-link>Comunidade</a>
    </nav>

    <form class="header-search" id="headerSearchForm" role="search" action="/acervo" method="get">
      <label for="headerSearch" class="sr-only">Pesquisar livros por nome ou autor</label>
      <input type="search" id="headerSearch" name="busca" class="header-search-input" placeholder="Pesquisar livros por nome ou autor...">
      <button type="submit" class="header-search-btn" aria-label="Pesquisar no acervo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <div class="header-right">
      <button type="button" class="nav-toggle" id="navToggle" aria-haspopup="true" aria-expanded="false" aria-controls="mainNav" aria-label="Abrir menu de navegação">
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
      <div class="header-actions" id="headerActions">
        <a class="btn btn-gold btn-small" href="/entrar" data-link>Entrar</a>
      </div>
    </div>
  </header>

  <main id="conteudo"></main>

  <footer class="footer" id="siteFooter">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="footer-logo">
          <img class="footer-logo-img" src="/img/logo.png" alt="" onerror="this.remove()">
          ✦ MariLuc Library
        </span>
        <p>Abra um livro. Atravesse uma realidade.</p>
      </div>
      <nav class="footer-col" aria-label="Navegação">
        <h3>Navegação</h3>
        <a href="/" data-link>Início</a>
        <a href="/acervo" data-link>Acervo</a>
        <a href="/comunidade" data-link>Comunidade</a>
      </nav>
      <nav class="footer-col" aria-label="Biblioteca">
        <h3>Biblioteca</h3>
        <a href="/sobre" data-link>Sobre</a>
        <a href="/categorias" data-link>Categorias</a>
        <a href="/ajuda" data-link>Ajuda</a>
      </nav>
      <nav class="footer-col" id="footerAccountCol" aria-label="Conta">
        <h3>Conta</h3>
        <a href="/entrar" data-link>Entrar</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <span>© 2026 MariLuc Library</span>
      <span>Projeto acadêmico — Desenvolvimento de Sistemas</span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
